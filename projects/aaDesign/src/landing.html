<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Welcome to AA Design</title>
        <link rel="icon" href="../img/aaDesignFavIcon.png" type="image/icon type" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <nav></nav>
        <img
            class="under-nav-banner"
            src="/img/banner1.jpg"
            alt="A banner depicting the text 'web design services' overlaid on a techie looking virtual background."
        />
        <main class="content">
            <section class="section-container">
                <h1 id="landing-aboutUsTitle"></h1>
                <p id="landing-aboutUsText"></p>
            </section>
            <section class="section-with-image">
                <img class="float-left" src="/img/flags.png" alt="a picture of the japanese and american flag" />
                <h2 id="landing-aboutUsSubheading1"></h2>
                <p id="landing-aboutUsSubtext1"></p>
            </section>
            <section class="section-with-image">
                <img
                    class="float-left"
                    src="/img/desktop.png"
                    alt="a cartoon picture of a computer with funky effects"
                />
                <h2 id="landing-aboutUsSubheading2"></h2>
                <p id="landing-aboutUsSubtext2"></p>
            </section>
            <section class="section-container">
                <h1 id="landing-serviceFeesTitle"></h1>
            </section>
        </main>
        <footer></footer>
        <script src="js/scripts.js"></script>
    </body>
</html>
