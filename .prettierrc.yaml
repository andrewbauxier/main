printWidth: 100
tabWidth: 4
useTabs: false
semi: true
singleQuote: true
trailingComma: es5
bracketSpacing: true
jsxBracketSameLine: false
proseWrap: preserve
endOfLine: lf

overrides:
  - files: '*.html'
    options:
      printWidth: 120
      tabWidth: 4
      singleQuote: false
      htmlWhitespaceSensitivity: 'css'
  - files: '*.css'
    options:
      printWidth: 120
      tabWidth: 4
      singleQuote: false
